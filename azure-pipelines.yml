# Azure DevOps pipeline for ala_service
# Generated by servicectl. Edit as needed.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  imageName: 'ghcr/ala_service'
  tag: $(Build.BuildId)
  GO_VERSION: '1.22'

stages:
  - stage: test
    displayName: vet + test
    jobs:
      - job: test
        displayName: test
        pool:
          vmImage: ubuntu-latest
        services:
          postgres:
            image: postgres:16-alpine
            env:
              POSTGRES_DB: ala_service_test
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
            ports:
              - 5432:5432
        variables:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ala_service_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        steps:
          - checkout: self
          - task: UseGoVersion@0
            inputs:
              versionSpec: $(GO_VERSION)
          - script: go mod download
            displayName: go mod download
          - script: go vet ./...
            displayName: go vet
          - script: |
              go test ./... -count=1 -race -coverprofile=coverage.out -covermode=atomic
              COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
              echo "total coverage: ${COVERAGE}%"
              awk -v want=80 -v got="$COVERAGE" 'BEGIN { if (got+0 < want+0) { exit 1 } }'
            displayName: go test (coverage gate 80%)

  - stage: build
    displayName: build + scan
    dependsOn: test
    jobs:
      - job: build
        displayName: build
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - script: docker build -t $(imageName):$(tag) .
            displayName: docker build
          - script: |
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL \
                $(imageName):$(tag)
            displayName: trivy scan

